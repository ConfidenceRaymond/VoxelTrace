name: ci

# Unit tests on synthetic fixtures only: no real DICOM, no models, no restricted data.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic data only)
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          voxeltrace --help
          voxeltrace preflight --help
          voxeltrace audit --help
          voxeltrace verify-bundle --help
