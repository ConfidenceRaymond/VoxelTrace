[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxeltrace"
version = "0.3.0"
description = "Local AI for Quantitative PET Intelligence (research prototype, not for clinical use)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Raymond Confidence" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydicom>=3.0",
    "nibabel>=5.2",
    "SimpleITK>=2.3",
    "Pillow>=10.0",
]

[project.scripts]
voxeltrace = "voxeltrace.cli:main"

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# data catalog: one reason code per line is easier to audit than wrapped entries
"src/voxeltrace/preflight/reasons.py" = ["E501"]
